<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANC PNC Visit Dates Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── HEADER ── -->
<header class="site-header">
  <div class="container header-inner">
    <div class="header-brand">
      <img src="src/assets/5e51f4bb9f92755118d2d3f75e42783d31be32a5.png" alt="Logo" class="header-logo" onerror="this.style.display='none'" />
      <span id="app-title" class="header-title"></span>
    </div>
    <div class="header-actions">
      <span id="badge-beta" class="badge badge-amber"></span>
      <button onclick="toggleLang()" id="lang-btn" class="btn btn-outline btn-sm"></button>
    </div>
  </div>
</header>

<!-- ── HERO ── -->
<section class="hero">
  <div class="container--sm">
    <h1 id="hero-h1"></h1>
    <p id="hero-p"></p>
    <div class="hero-btns">
      <button id="btn-join-hero" onclick="window.open(GROUP_URL,'_blank')" class="btn btn-primary btn-lg"></button>
      <button id="btn-download-hero" onclick="window.open(APP_URL,'_blank')" class="btn btn-outline btn-lg"></button>
    </div>
    <img src="src/assets/graphic_white_phone.png" alt="App Preview" class="hero-img" onerror="this.style.display='none'" />
  </div>
</section>

<!-- ── ALERT ── -->
<div class="container" style="padding-bottom:1.5rem">
  <div class="alert alert-amber">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <div>
      <p id="alert-title" class="alert-title" style="color:#92400e"></p>
      <p id="alert-desc" class="alert-desc" style="color:#b45309"></p>
    </div>
  </div>
</div>

<!-- ── GETTING STARTED ── -->
<section class="section">
  <div class="container">
    <h2 id="gs-title" class="section-title"></h2>
    <div class="steps">

      <!-- Step 1 -->
      <div class="card card-body">
        <div class="step-header">
          <div class="step-circle step-blue">1</div>
          <div class="step-meta">
            <h3 id="s1-title"></h3>
            <p id="s1-desc"></p>
          </div>
        </div>
        <div class="step-body">
          <ol id="s1-list"></ol>
          <button id="s1-btn" onclick="window.open(GROUP_URL,'_blank')" class="btn btn-primary" style="margin-top:1rem"></button>
        </div>
      </div>

      <!-- Step Chrome: Set Chrome as Default Browser -->
      <div class="card card-body">
        <div class="step-header">
          <div class="step-circle step-chrome">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" y1="8" x2="12" y2="8"/><line x1="3.95" y1="6.06" x2="8.54" y2="14"/><line x1="10.88" y1="21.94" x2="15.46" y2="14"/></svg>
          </div>
          <div class="step-meta">
            <h3 id="sc-title"></h3>
            <p id="sc-desc"></p>
          </div>
        </div>
        <div class="step-body">
          <div class="alert alert-blue" style="margin-bottom:1rem">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <p id="sc-alert" class="alert-desc" style="color:#1d4ed8"></p>
          </div>
          <p id="sc-android-title" class="step-os-title"></p>
          <ol id="sc-android-list"></ol>

        </div>
      </div>

      <!-- Step 2 -->
      <div class="card card-body">
        <div class="step-header">
          <div class="step-circle step-purple">2</div>
          <div class="step-meta">
            <h3 id="s2-title"></h3>
            <p id="s2-desc"></p>
          </div>
        </div>
        <div class="step-body">
          <ol>
            <li class="has-img">
              <span id="s2-li1"></span>
              <img src="src/assets/join_google_group_1.png" alt="Group permission screen" class="step-img" onerror="this.style.display='none'" />
            </li>
            <li class="has-img">
              <span id="s2-li2"></span>
              <img src="src/assets/join_google_group_2.png" alt="Join group screen" class="step-img" onerror="this.style.display='none'" />
            </li>
            <li id="s2-li3"></li>
            <li id="s2-li4"></li>
            <li id="s2-li5"></li>
            <li id="s2-li6"></li>
          </ol>
          <button id="s2-btn" onclick="window.open(GROUP_URL,'_blank')" class="btn btn-primary" style="margin-top:1rem"></button>
        </div>
      </div>

      <!-- Step 3 -->
      <div class="card card-body">
        <div class="step-header">
          <div class="step-circle step-green">3</div>
          <div class="step-meta">
            <h3 id="s3-title"></h3>
            <p id="s3-desc"></p>
          </div>
        </div>
        <div class="step-body">
          <ol id="s3-list"></ol>
          <button id="s3-btn" onclick="window.open(APP_URL,'_blank')" class="btn btn-green" style="margin-top:1rem"></button>
        </div>
      </div>

      <!-- Step 4 -->
      <div class="card card-body">
        <div class="step-header">
          <div class="step-circle step-orange">4</div>
          <div class="step-meta">
            <h3 id="s4-title"></h3>
            <p id="s4-desc"></p>
          </div>
        </div>
        <div class="step-body">
          <div class="alert alert-orange" style="margin-bottom:1rem">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <p id="s4-alert" class="alert-desc" style="color:#9a3412"></p>
          </div>
          <img src="src/assets/play_store_no_app_found.png" alt="App not found" class="step-img" onerror="this.style.display='none'" />
          <p id="s4-img-caption" style="font-size:0.8rem;color:#6b7280;margin:0.4rem 0 1rem"></p>
          <p id="s4-sub-title" style="font-weight:600;color:#c2410c;font-size:0.9rem;margin-bottom:0.5rem"></p>
          <ol id="s4-list"></ol>
          <div class="alert alert-blue" style="margin-top:1rem">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <div>
              <p id="s4-remember-title" class="alert-title" style="color:#1e40af"></p>
              <p id="s4-remember-desc" class="alert-desc" style="color:#1d4ed8"></p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- ── WEBSITE BANNER ── -->
<section class="section" style="padding-bottom:0">
  <div class="container">
    <div class="web-banner">
      <div class="web-banner-text">
        <p id="web-banner-label"></p>
        <h3 id="web-banner-title"></h3>
      </div>
      <a href="https://ancdatecal.onrender.com/" target="_blank" class="web-banner-link">
        ancdatecal.onrender.com
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
      </a>
    </div>
  </div>
</section>

<!-- ── FEATURES ── -->
<section class="section section-gradient">
  <div class="container">
    <h2 id="features-title" class="section-title"></h2>
    <p id="features-desc" class="section-subtitle"></p>
    <div class="features-grid">

      <div class="feature-card">
        <div class="feature-icon feature-icon-blue">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </div>
        <h3 id="f-copy-title"></h3>
        <p id="f-copy-desc"></p>
      </div>

      <div class="feature-card">
        <div class="feature-icon feature-icon-green">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </div>
        <h3 id="f-share-title"></h3>
        <p id="f-share-desc"></p>
      </div>

      <div class="feature-card">
        <div class="feature-icon feature-icon-purple">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <h3 id="f-pdf-title"></h3>
        <p id="f-pdf-desc"></p>
      </div>

      <div class="feature-card">
        <div class="feature-icon feature-icon-amber">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <h3 id="f-anc-title"></h3>
        <p id="f-anc-desc"></p>
      </div>

      <div class="feature-card">
        <div class="feature-icon feature-icon-rose">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
        <h3 id="f-pnc-title"></h3>
        <p id="f-pnc-desc"></p>
      </div>

      <div class="feature-card">
        <div class="feature-icon feature-icon-dark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </div>
        <h3 id="f-dark-title"></h3>
        <p id="f-dark-desc"></p>
      </div>

    </div>
  </div>
</section>

<!-- ── FAQ ── -->
<section class="section section-alt">
  <div class="container--sm">
    <h2 id="faq-title" class="section-title"></h2>
    <div id="faq-list" class="faq-list"></div>
  </div>
</section>

<!-- ── QUICK LINKS ── -->
<section class="section">
  <div class="container">
    <h2 id="ql-title" class="section-title"></h2>
    <div class="quick-links">
      <div class="card ql-card card--bordered-blue" onclick="window.open(GROUP_URL,'_blank')">
        <div class="ql-icon ql-icon-blue">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div class="ql-info">
          <h3>Google Group</h3>
          <p>groups.google.com/g/anc-pnc-visit-calculation-app/</p>
          <small id="ql-access"></small>
        </div>
      </div>
      <div class="card ql-card card--bordered-green" onclick="window.open(APP_URL,'_blank')">
        <div class="ql-icon ql-icon-green">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </div>
        <div class="ql-info">
          <h3 id="ql-dl-label"></h3>
          <p>play.google.com/store/apps/details?id=com.app.anc_date_calculator</p>
          <small id="ql-dl-access"></small>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ── FOOTER ── -->
<footer class="site-footer">
  <p id="footer-text"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
